name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Show project files
        run: ls -la && ls -la lib || true

      # The project has no android/ folder, so generate it
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name interactive_recipe_book .

      - run: flutter pub get

      # Shows Dart errors clearly (does not stop the build)
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v5
        with:
          name: recipe-book-apk
          path: build/app/outputs/flutter-apk/app-release.apk
